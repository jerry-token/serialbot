[workspace]
resolver = "3"
members = ["crates/serialx-core", "crates/serialx-mcp", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/jerry-token/serialx"
publish = false

[workspace.dependencies]
bytes = "1.12"
thiserror = "2.0"
proptest = "1.12"
regex = "1.12"
serialport = "4.10"
encoding_rs = "0.8"
serialx-core = { path = "crates/serialx-core" }
serialx-mcp = { path = "crates/serialx-mcp" }
rmcp = { version = "3.10", default-features = false }
axum = { version = "0.8", default-features = false }
tokio = "1.54"
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
getrandom = "0.4"
tauri = "2.12"
tauri-build = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Never allow these to slip into the codebase.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
