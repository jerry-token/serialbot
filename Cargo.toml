[workspace]
resolver = "3"
members = [
    "crates/serialbot-cli",
    "crates/serialbot-core",
    "crates/serialbot-jobs",
    "crates/serialbot-mcp",
    "app/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
authors = ["Jerry <support@aiany.cc>"]
repository = "https://github.com/jerry-token/serialbot"
homepage = "https://serialbot.aiany.cc"
publish = false

[workspace.dependencies]
bytes = "1.12"
thiserror = "2.0"
proptest = "1.12"
regex = "1.12"
serialport = "4.10"
encoding_rs = "0.8"
serialbot-core = { path = "crates/serialbot-core" }
serialbot-jobs = { path = "crates/serialbot-jobs" }
serialbot-mcp = { path = "crates/serialbot-mcp" }
rmcp = { version = "3.10", default-features = false }
axum = { version = "0.8", default-features = false }
tokio = "1.54"
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
getrandom = "0.4"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Never allow these to slip into the codebase.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Smaller, faster release binaries (installers and the portable exe): one
# codegen unit with link-time optimization, and no symbol tables.
[profile.release]
codegen-units = 1
lto = true
strip = true
