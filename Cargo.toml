[workspace]
resolver = "3"
members = ["crates/serialx-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/jerry-token/serialx"
publish = false

[workspace.dependencies]
bytes = "1.12"
thiserror = "2.0"
proptest = "1.12"
regex = "1.12"
serialport = "4.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Never allow these to slip into the codebase.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
