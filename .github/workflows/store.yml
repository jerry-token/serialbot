# Builds the Microsoft Store package (MSIX) of the app. Run it from Actions →
# "Microsoft Store package" → "Run workflow", or let the Release workflow
# call it for every release. The MSIX lands in this run's artifacts, to be
# uploaded in Partner Center (SerialBot → Packages): the Store signs it, so
# it is not attached to the GitHub release, where it could not be installed.
#
# Before keeping it, the run signs a copy with a throwaway certificate,
# installs it on the runner and starts the app through its alias, so a
# package Windows would refuse never reaches the Store.
name: Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.3.0-beta.2 (the Store number is made from it)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  # A change to the packaging is tried on its pull request (Windows minutes
  # are dear, so only then).
  pull_request:
    paths:
      - .github/workflows/store.yml
      - .github/scripts/package_msix.py
      - app/src-tauri/tauri.conf.json

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msix:
    name: MSIX (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The toolchain comes from rust-toolchain.toml. No installer: the
      # package is made from the program itself.
      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Package
        env:
          VERSION: ${{ inputs.version || '0.0.0-alpha.1' }}
        run: python .github/scripts/package_msix.py --exe target/release/serialbot.exe --version "${VERSION#v}" --out dist

      - name: Install and start a signed copy
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist\*.msix | Select-Object -First 1
          $subject = (Select-String -Path .github\scripts\package_msix.py -Pattern '^PUBLISHER = "(.*)"').Matches[0].Groups[1].Value
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          Copy-Item $msix.FullName signed-test.msix
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint signed-test.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage -Path signed-test.msix
          $package = Get-AppxPackage -Name Jerry-Token.SerialBot
          if (-not $package) { throw "the package did not install" }
          Write-Output "installed $($package.PackageFullName)"
          # The alias starts the program; without the app's settings the stdio
          # bridge says the app has not been started, which proves it ran.
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\serialbot.exe"
          if (-not (Test-Path $alias)) { throw "no serialbot.exe alias" }
          # A GUI-subsystem program: wait for it and read its stderr from a file.
          New-Item -ItemType File empty.txt -Force | Out-Null
          $run = Start-Process -FilePath $alias -ArgumentList mcp -Wait -PassThru `
            -RedirectStandardInput empty.txt -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          $out = Get-Content err.txt -Raw
          Write-Output "exit $($run.ExitCode): $out"
          if ($out -notmatch "not been started|is off") { throw "the alias did not start SerialBot" }
          Remove-AppxPackage -Package $package.PackageFullName

      - uses: actions/upload-artifact@v7
        with:
          name: SerialBot-msix-${{ inputs.version || '0.0.0-alpha.1' }}
          path: dist/*.msix
          if-no-files-found: error
