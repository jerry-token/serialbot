# Builds installers for Windows, macOS and Linux and publishes them on the
# GitHub release page. Start it either way:
#   - push a version tag:  git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#   - Actions → Release → "Run workflow", entering the version; the tag is
#     then created on the selected commit.
# The app's installers and serialbot-cli's archives (and .deb) are built in
# parallel and published together; the Microsoft Store MSIX is built too and
# kept in the run's artifacts (store.yml).
# Versions with a pre-release part (-alpha, -beta, -rc) are marked pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0 or v0.1.0-alpha.1"
            exit 1
          fi
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          repo="${{ github.repository }}"
          # Re-running a release reuses it (as a draft again) instead of failing.
          # Drafts are found by name: one whose tag was never created has none.
          id=$(gh api "repos/$repo/releases?per_page=50" \
            --jq ".[] | select(.name == \"SerialBot $TAG\") | .id" | head -n1)
          if [[ "$id" =~ ^[0-9]+$ ]]; then
            gh api -X PATCH "repos/$repo/releases/$id" -F draft=true \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -F prerelease=$prerelease -F body=@.github/release-notes.md --jq .id
          else
            # A pushed tag already exists; a manual run creates it on this commit.
            id=$(gh api "repos/$repo/releases" -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" -f name="SerialBot $TAG" \
              -F draft=true -F prerelease=$prerelease \
              -F body=@.github/release-notes.md --jq .id)
          fi
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::could not create or find the release for $TAG"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            plain_binary: true
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            plain_binary: false
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            plain_binary: false
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            args: --bundles deb,appimage
            plain_binary: false
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libudev-dev patchelf

      # The toolchain comes from rust-toolchain.toml.
      - name: Install Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.plain_binary }}

  # serialbot-cli is a separate download: archives for every system, and a
  # .deb on Linux (see .github/scripts/package_cli.py).
  cli:
    name: CLI (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            package: linux-x64
            python: python3
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            package: linux-arm64
            python: python3
          - name: macOS universal
            platform: macos-latest
            package: macos-universal
            python: python3
          - name: Windows x64
            platform: windows-latest
            package: windows-x64
            python: python
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libudev-dev

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            rustup toolchain install
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p serialbot-cli --target "$target"
            done
            mkdir -p target/universal
            lipo -create -output target/universal/serialbot-cli \
              target/aarch64-apple-darwin/release/serialbot-cli \
              target/x86_64-apple-darwin/release/serialbot-cli
            echo "BINARY=target/universal/serialbot-cli" >> "$GITHUB_ENV"
          else
            cargo build --release --locked -p serialbot-cli
            exe=""
            if [[ "$RUNNER_OS" == Windows ]]; then exe=".exe"; fi
            echo "BINARY=target/release/serialbot-cli$exe" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: |
          ${{ matrix.python }} .github/scripts/package_cli.py --binary "$BINARY" \
            --version "${TAG#v}" --platform ${{ matrix.package }} --out dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          for file in dist/*; do
            name=$(basename "$file")
            # A re-run replaces the file uploaded before.
            old=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$name\") | .id")
            if [[ -n "$old" ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name" \
              > /dev/null
            echo "uploaded $name"
          done

  # The Microsoft Store package, kept in the run's artifacts for Partner Center.
  store:
    name: Microsoft Store package
    uses: ./.github/workflows/store.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish release
    needs: [create-release, build, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The notes list the sizes of the files actually built, so they never go stale.
      - name: Add download sizes to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          api="repos/${{ github.repository }}/releases/$RELEASE_ID"
          sizes=$(gh api "$api" | python3 .github/scripts/release_sizes.py)
          printf '%s\n\n%s\n' "$(cat .github/release-notes.md)" "$sizes" > notes.md
          # A draft whose tag does not exist yet loses it on any edit that
          # leaves tag_name out, so it is always sent.
          gh api -X PATCH "$api" -f tag_name="$TAG" -F body=@notes.md --jq .id
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -F draft=false --jq '"\(.tag_name) published: \(.html_url)"'
