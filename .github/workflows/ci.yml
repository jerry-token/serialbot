name: CI

# Pull requests run on Linux only; macOS and Windows minutes cost 10x and
# 2x, so the three-OS matrix runs after merging to main, weekly, and on
# demand. Release builds cover all three platforms as well.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Virtual-port tests must run in CI, never silently skip.
  SERIALBOT_REQUIRE_SOCAT: "1"
  # The toolchain comes from rust-toolchain.toml (rustup installs it on first use).
  # udev for port listing, socat for virtual-port tests, the rest for Tauri.
  LINUX_DEPS: libudev-dev socat libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.90 check --workspace --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  coverage:
    name: Coverage (>= 85% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 85 --summary-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  deny:
    name: Licenses & advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
