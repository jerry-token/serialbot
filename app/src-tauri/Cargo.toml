[package]
name = "serialbot-app"
description = "Desktop app: Tauri shell around the serialbot core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "serialbot_app"

[[bin]]
name = "serialbot"
path = "src/main.rs"

[dependencies]
serialbot-core.workspace = true
serialbot-decode.workspace = true
serialbot-jobs.workspace = true
serialbot-mcp.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "7"
open = "5"
tokio = { workspace = true, features = ["net", "sync", "time", "rt"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true
