<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{privacy_title}} · SerialBot</title>
<meta name="description" content="{{privacy_intro}}">
<link rel="icon" href="{{root}}images/icon.png">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="zh-Hans" href="{{url_zh}}">
<link rel="alternate" hreflang="x-default" href="{{url_en}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SerialBot">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{privacy_title}} · SerialBot">
<meta property="og:description" content="{{privacy_intro}}">
<meta property="og:image" content="{{site_url}}/images/windows.png">
<meta property="og:image:width" content="1496">
<meta property="og:image:height" content="926">
<meta property="og:image:alt" content="{{shot_windows}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{privacy_title}} · SerialBot">
<meta name="twitter:description" content="{{privacy_intro}}">
<meta name="twitter:image" content="{{site_url}}/images/windows.png">
<link rel="stylesheet" href="{{root}}style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="{{root}}{{home}}"><img src="{{root}}images/icon.png" alt="" width="28" height="28">SerialBot</a>
  <nav aria-label="{{nav_label}}">
    <a href="{{root}}{{other_home}}privacy/" hreflang="{{other_lang}}" lang="{{other_lang}}">{{other_lang_name}}</a>
    <a href="https://github.com/jerry-token/serialbot">GitHub</a>
  </nav>
</header>

<main class="policy">
<section>
  <h1>{{privacy_title}}</h1>
  <p class="lede">{{privacy_intro}}</p>
  <p class="updated">{{privacy_updated}}</p>
  {{privacy_body}}
</section>
</main>

<footer>
  <p>{{footer_license}}</p>
  <p><a href="mailto:support@aiany.cc">support@aiany.cc</a> <a href="{{root}}{{home}}">{{privacy_home}}</a></p>
</footer>
</body>
</html>
