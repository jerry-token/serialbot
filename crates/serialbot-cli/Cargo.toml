[package]
name = "serialbot-cli"
description = "SerialBot in the terminal: list ports, send, monitor, run scripts, serve MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "serialbot-cli"
path = "src/main.rs"

[dependencies]
serialbot-core.workspace = true
serialbot-jobs.workspace = true
serialbot-mcp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
dirs = "7"
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
sys-locale = "0.3"
ctrlc = { version = "3.4", features = ["termination"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
unicode-width = "0.2"
encoding_rs.workspace = true
jiff = "0.2"

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
bytes.workspace = true
vt100 = "0.16"
expectrl = "0.8"

[lints]
workspace = true
