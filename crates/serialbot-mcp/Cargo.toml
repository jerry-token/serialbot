[package]
name = "serialbot-mcp"
description = "MCP server (Streamable HTTP) that lets AI agents drive serialbot sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serialbot-core.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest", "transport-io"] }
axum = { workspace = true, features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
regex.workspace = true
thiserror.workspace = true
getrandom.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
